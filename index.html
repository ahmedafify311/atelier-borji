/* ---------- بلاغ "مش جاهزة" ---------- */
let pendingReason = null;
const REASONS = ['الألواح ما نزلت', 'التقشيط مش موجود'];
ACT.notReady = d => {
  const o = byId(d.id); if (!o) return;
  pendingReason = null;
  openModal(`<span class="num">${hid(o.id)}</span> مش جاهزة؟`, `
    <p class="muted" style="margin:0 0 8px">${esc(o.client)} · اختار السبب، والبلاغ بيوصل لأحمد والمسئول هلّق.</p>
    <div class="reasons">${REASONS.map(r => `<button data-act="reason" data-v="${r}">${r}</button>`).join('')}
      <button data-act="reason" data-v="other">غير ذلك</button></div>
    <input class="inp" id="otherR" placeholder="اكتب السبب بسطر" style="display:none;margin-bottom:10px">
    <button class="big" style="--c:var(--red)" data-act="sendReport" data-id="${o.id}">${ic('alert')} بلّغ الإدارة</button>`);
};
ACT.reason = (d, el) => {
  pendingReason = d.v;
  el.parentNode.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el));
  const inp = document.getElementById('otherR');
  inp.style.display = d.v === 'other' ? 'block' : 'none';
  if (d.v === 'other') inp.focus();
};
ACT.sendReport = d => {
  const o = byId(d.id); if (!o) return;
  let reason = pendingReason === 'other' ? (document.getElementById('otherR').value || '').trim() : pendingReason;
  if (!reason) { toast(pendingReason === 'other' ? 'اكتب السبب' : 'اختار السبب الأول'); return; }
  const rp = { id:'R' + (++S.repSeq), oid:o.id, line:o.line, reason, t:Date.now(), status:'open', live:1, seenAhmed:false, seenMgr:false, seenSup:true };
  S.reports.push(rp);
  o.blocked = true; o.blockReason = reason;
  logEv('report', o.id, `بلّغ "مش جاهزة": ${reason}`, { red:1, line:o.line });
  closeModal(); commit();
  toast(`${ic('check')} البلاغ وصل لأحمد والمسئول`);
};

function reportBlock(rp) {
  const o = byId(rp.oid), r = ROLE();
  const cands = lineQueue(rp.line).filter(x => x.id !== rp.oid && !x.blocked).slice(0, 3);
  return `<div class="report">
    <div class="rt">${ic('alert')} خط ${rp.line} · طلبية <span class="num">${hid(rp.oid)}</span></div>
    <div class="rs"><b>${esc(rp.reason)}</b> · ${esc(o ? o.client : '')}<br><span class="muted small">من ${fmtT(rp.t, fmtDay(rp.t) !== fmtDay(Date.now()))} · المكنة واقفة صرلها ${fmtDur(Date.now() - rp.t)}</span></div>
    ${r.mgmt ? `<div class="acts">
      ${cands.map(c => `<button class="btn sm" data-act="promote" data-r="${rp.id}" data-o2="${c.id}">قدّم <span class="num">${hid(c.id)}</span></button>`).join('')}
      <button class="btn sm dark" data-act="clearBlock" data-id="${rp.oid}">${ic('check')} جاهزة للتقطيع</button></div>` : ''}
  </div>`;
}
function reportsPanel() {
  const reps = openReports();
  const waitingMat = S.orders.filter(o => o.blocked && !reportFor(o.id));
  return `<section class="panel"><h2 style="${reps.length ? 'color:var(--red)' : ''}">${ic('alert')} البلاغات المفتوحة <span class="cnt">${reps.length}</span></h2>
    <div class="stack">${reps.map(reportBlock).join('') || '<div class="empty">ما في بلاغات مفتوحة</div>'}
    ${waitingMat.map(o => `<div class="row" style="border:1px solid var(--red-line);border-radius:10px;padding:8px 10px"><span class="grow small"><b class="num">${hid(o.id)}</b> ${esc(o.client)}<br><span class="muted">مستنية خامات: ${esc(o.blockReason || '')}</span></span><button class="btn sm" data-act="clearBlock" data-id="${o.id}">جاهزة للتقطيع</button></div>`).join('')}
    </div></section>`;
}
ACT.reportSheet = d => {
  const rp = S.reports.find(x => x.id === d.r); if (!rp) return;
  openModal('بلاغ "مش جاهزة"', `${reportBlock(rp)}<p class="small muted" style="margin:10px 0 0">"قدّم" بتطلّع طلبية تانية أول الطابور، والمشرف بيشوفها عنده هلّق.</p>`);
};
ACT.promote = d => {
  const rp = S.reports.find(x => x.id === d.r), o2 = byId(d.o2); if (!rp || !o2) return;
  const q = lineQueue(rp.line).filter(x => x !== o2); q.unshift(o2); q.forEach((x, i) => x.qpos = i + 1);
  rp.status = 'resolved'; rp.res = { type:'promote', oid2:o2.id, who:ROLE().who, t:Date.now() }; rp.seenSup = false;
  logEv('promote', rp.oid, `قدّم طلبية ${hid(o2.id)} مكانها`);
  closeModal(); commit();
  toast(`المشرف بيشوف هلّق: الطلبية الجاية ${hid(o2.id)}`);
};
ACT.clearBlock = d => {
  const o = byId(d.id); if (!o) return;
  o.blocked = false; o.blockReason = '';
  const rp = reportFor(o.id);
  if (rp) { rp.status = 'resolved'; rp.res = { type:'clear', who:ROLE().who, t:Date.now() }; rp.seenSup = false; }
  logEv('clear', o.id, 'علّمها جاهزة للتقطيع');
  closeModal(); commit(); toast(`${hid(o.id)} رجعت عادية`);
};

/* ---------- الفضلات ---------- */
const isOld = x => Date.now() - x.at > 90 * DAY;
function loRow(x, opt = {}) {
  const r = ROLE();
  return `<div class="lorow${opt.mini ? ' mini' : ''}">
    <span class="sw" style="background:${colorInfo(x.color)[2]}"></span>
    <span class="losz">${sz(x)}</span>
    <div class="grow"><div class="d">${colorBadge(x.color)} <b>${esc(colorInfo(x.color)[1])}</b></div>
      <div class="d">${x.status === 'reserved' ? `محجوزة لطلبية <span class="num">${hid(x.oid)}</span>` : `من ${esc(x.from)} · ${fmtDay(x.at)}`} ${isOld(x) && x.status === 'avail' ? '<span class="tag old">قديمة</span>' : ''}</div></div>
    ${r.mgmt && x.status === 'avail' && !opt.mini ? `<button class="btn sm" data-act="loUsed" data-lo="${x.id}">استُخدمت</button>` : ''}
  </div>`;
}
const availLo = () => S.leftovers.filter(x => x.status === 'avail').sort((a, b) => b.w * b.h - a.w * a.h);
SCREENS.lo = () => {
  const r = ROLE(), all = availLo();
  const codes = [...new Set(all.map(x => x.color))];
  if (UI.loFilter && !codes.includes(UI.loFilter)) UI.loFilter = '';
  const list = UI.loFilter ? all.filter(x => x.color === UI.loFilter) : all;
  const res = S.leftovers.filter(x => x.status === 'reserved');
  let h = `<div class="sec-title">${ic('piece')} الفضل الموجودة بالمكان <span class="cnt">${all.length}</span></div>
    <div class="filters"><button class="fbtn${!UI.loFilter ? ' on' : ''}" data-act="loFilter" data-v="">كل الألوان</button>${codes.map(c => `<button class="fbtn${UI.loFilter === c ? ' on' : ''}" data-act="loFilter" data-v="${c}">${c}</button>`).join('')}</div>
    <div class="stack">${list.map(x => loRow(x)).join('') || '<div class="empty">ما في فضل</div>'}</div>`;
  if (res.length) h += `<div class="sec-title" style="margin-top:6px">محجوزة لطلبيات <span class="cnt">${res.length}</span></div><div class="stack">${res.map(x => loRow(x)).join('')}</div>`;
  if (UI.role === 'ahmed') h += `<section class="panel"><h2>${ic('plus')} ضيف فضلة يدوي</h2>
    <div class="row" style="flex-wrap:wrap"><input class="inp" id="loW" type="number" placeholder="طول مم" style="width:110px"><span>×</span><input class="inp" id="loH" type="number" placeholder="عرض مم" style="width:110px">
    <input class="inp" id="loC" list="colorsDL2" placeholder="كود اللون" style="width:150px"><datalist id="colorsDL2">${COLORS.map(c => `<option value="${c[0]}">${c[1]}</option>`).join('')}</datalist>
    <button class="btn dark" data-act="loAdd">ضيف</button></div></section>`;
  return r.desk ? `<div class="wide">${h}</div>` : h;
};
function loPanel() {
  const all = availLo();
  return `<section class="panel"><div class="sec-title">${ic('piece')} الفضلات <span class="cnt">${all.length}</span><button class="more" data-act="tab" data-t="lo">كلها ←</button></div>
    <div class="stack">${all.slice(0, 5).map(x => loRow(x, { mini:true })).join('') || '<div class="empty">ما في فضل</div>'}</div></section>`;
}
ACT.loFilter = d => { UI.loFilter = d.v; render(); };
ACT.loUsed = d => {
  const x = S.leftovers.find(l => l.id === d.lo); if (!x) return;
  withUndo(`الفضلة ${sz(x)} تعلّمت استُخدمت`, null, () => { x.status = 'used'; logEv('loUsed', null, `علّم الفضلة ${sz(x)} (${x.color}) استُخدمت`); });
};
ACT.loAdd = () => {
  const w = parseInt(document.getElementById('loW').value, 10), h = parseInt(document.getElementById('loH').value, 10), c = colorCode(document.getElementById('loC').value);
  if (!(w > 0 && h > 0 && c)) { toast('اكتب المقاس وكود اللون'); return; }
  S.leftovers.push({ id:'L' + (++S.loSeq), w, h, color:c, from:'إضافة يدوي', at:Date.now(), status:'avail', oid:null });
  logEv('loAdd', null, `ضاف فضلة يدوي ${sz({ w, h })} (${c})`);
  commit(); toast('الفضلة انضافت للقايمة');
};

/* ---------- التسليم ---------- */
ACT.deliver = d => {
  const o = byId(d.id); if (!o || o.status !== 'ready') return;
  if (o.glue) {
    openModal(`ما فيك تسلّم <span class="num">${hid(o.id)}</span> هلّق`, `
      <p style="font-size:17px;font-weight:600;margin:0 0 6px">⏳ الدوبل بعدو عالكولة.</p>
      <p class="muted" style="margin:0 0 14px">الطلبية ما بتتسلّم ناقصة. لما ترجع شقف الدوبل وتنضم للطلبية، دوس "الدوبل جاهز" وبعدين سلّم.</p>
      <div class="actions">${!ROLE().view ? `<button class="btn dark" data-act="glueDone" data-id="${o.id}">الدوبل جاهز</button>` : ''}<button class="btn" data-act="close">تمام</button></div>`);
    return;
  }
  if (o.scrap) {
    openModal(`تسليم <span class="num">${hid(o.id)}</span>`, `
      <p style="margin:0 0 4px;font-size:15px">${esc(o.client)} · ركن ${o.corner}</p>
      <p style="font-size:22px;font-weight:700;margin:10px 0 14px">العميل أخد الفضلة ${sz(o.scrap)}؟</p>
      <div class="stack"><button class="big" style="--c:#15803d" data-act="doDeliver" data-id="${o.id}" data-took="1">${ic('check')} إيه، أخدها</button>
      <button class="big plain" data-act="doDeliver" data-id="${o.id}" data-took="0">لأ، بتروح لقايمة الفضلات</button></div>`);
    return;
  }
  ACT.doDeliver({ id:o.id, took:'' });
};
ACT.doDeliver = d => {
  const o = byId(d.id); if (!o || o.glue) return;
  const took = d.took === '1';
  closeModal();
  withUndo(`تسلّمت: ${hid(o.id)}${o.scrap && !took ? ` · الفضلة ${sz(o.scrap)} دخلت القايمة` : ''}`, o.id, () => {
    o.status = 'done'; o.doneAt = Date.now(); o.tookLo = o.scrap ? took : null;
    logEv('deliver', o.id, 'سلّمها للعميل' + (o.scrap ? (took ? '، والعميل أخد الفضلة' : '، والعميل ما أخد الفضلة') : ''));
    if (o.scrap && !took) {
      S.leftovers.push({ id:'L' + (++S.loSeq), w:o.scrap.w, h:o.scrap.h, color:o.color, from:`طلبية ${hid(o.id)}، ${o.client}`, at:Date.now(), status:'avail', oid:null });
      logEv('loIn', o.id, `الفضلة ${sz(o.scrap)} دخلت قايمة الفضلات`, { who:SYS, auto:1 });
    }

const shortWho = w => w.startsWith('المشرف') ? 'المشرف' : w;

function orderSummary(o) {

/* ---------- ملخص الأسبوع ---------- */
const DAYS = ['الاثنين', 'التلاتا', 'الأربعا', 'الخميس', 'الجمعة', 'السبت', 'الأحد'];
function weekStats() {
  const W = S.week, ws = weekStart();
  const live = S.events.filter(e => e.live && !e.undone && e.t >= ws);
  const readyEv = live.filter(e => e.type === 'finishSand' || e.type === 'readyNoSand');
  const daily = W.daily.slice(); daily[daily.length - 1] += readyEv.length;
  const done = daily.reduce((a, b) => a + b, 0);
  const lastTo = W.lastDaily.slice(0, daily.length).reduce((a, b) => a + b, 0);
  let sumH = W.avgH * W.avgN, n = W.avgN;
  readyEv.forEach(e => { const o = byId(e.oid); if (o) { sumH += (e.t - o.at) / H; n++; } });
  const lines = JSON.parse(JSON.stringify(W.lines));
  readyEv.forEach(e => { if (lines[e.line]) { lines[e.line].o++; lines[e.line].s += e.sheets || 0; } });
  const loUsed = W.loUsed + live.filter(e => e.type === 'loReserve').length;
  const liveReps = S.reports.filter(r => r.live && r.t >= ws && !S.events.some(e => e.undone && e.type === 'report' && e.oid === r.oid && Math.abs(e.t - r.t) < 1000));
  const reasons = Object.assign({}, W.reasons);
  liveReps.forEach(r => reasons[r.reason] = (reasons[r.reason] || 0) + 1);
  const top = Object.entries(reasons).sort((a, b) => b[1] - a[1])[0];
  const downMin = W.downMin + liveReps.reduce((a, r) => a + Math.round(((r.res ? r.res.t : Date.now()) - r.t) / MIN), 0);
  return { daily, done, lastTo, avgH: sumH / n, lines, loUsed, reports: W.reports + liveReps.length, top, downMin, stageH: W.stageH };
}
/* بعد "ابدأ فاضي": كل الأرقام من الحركات الحقيقية بس، من يوم ما بدأنا */
function realStats() {
  const ev = S.events.filter(e => !e.undone);
  const readyEv = ev.filter(e => e.type === 'finishSand' || e.type === 'readyNoSand');
  const first = (oid, type) => ev.find(e => e.oid === oid && e.type === type);
  let sumH = 0, n = 0;
  readyEv.forEach(e => { const o = byId(e.oid); if (o) { sumH += (e.t - o.at) / H; n++; } });
  const st = { queue:[], cut:[], waitsand:[], sand:[] };
  [...new Set(ev.map(e => e.oid).filter(Boolean))].forEach(id => {
    const a = first(id, 'assign'), sc = first(id, 'startCut'), fc = first(id, 'finishCut'), wt = first(id, 'waitSand'), es = first(id, 'enterSand'), fs = first(id, 'finishSand');
    if (a && sc) st.queue.push(sc.t - a.t);
    if (sc && fc) st.cut.push(fc.t - sc.t);
    if (wt && es) st.waitsand.push(es.t - wt.t);
    if (es && fs) st.sand.push(fs.t - es.t);
  });
  const stageH = {};
  Object.entries(st).forEach(([k, v]) => { if (v.length) stageH[k] = v.reduce((a, b) => a + b, 0) / v.length / H; });
  const lines = { 1:{ o:0, s:0 }, 2:{ o:0, s:0 } };
  readyEv.forEach(e => { if (lines[e.line]) { lines[e.line].o++; lines[e.line].s += e.sheets || 0; } });
  const reasons = {};
  S.reports.forEach(r => reasons[r.reason] = (reasons[r.reason] || 0) + 1);
  const top = Object.entries(reasons).sort((a, b) => b[1] - a[1])[0];
  const downMin = S.reports.reduce((a, r) => a + Math.round(((r.res ? r.res.t : Date.now()) - r.t) / MIN), 0);
  // كل يوم: من يوم ما بدأنا، آخر 7 أيام بالكتير
  const today = Date.UTC(new Date().getUTCFullYear(), new Date().getUTCMonth(), new Date().getUTCDate());
  const startDay = Date.UTC(new Date(S.startedAt).getUTCFullYear(), new Date(S.startedAt).getUTCMonth(), new Date(S.startedAt).getUTCDate());
  const days = [];
  for (let d = Math.max(startDay, today - 6 * DAY); d <= today; d += DAY) days.push({ d, v: readyEv.filter(e => e.t >= d && e.t < d + DAY).length });
  return { done:readyEv.length, doneWeek:readyEv.filter(e => e.t >= weekStart()).length, avgH: n ? sumH / n : null, stageH, lines,
    loUsed: ev.filter(e => e.type === 'loReserve').length, reports:S.reports.length, top, downMin, days };
}
